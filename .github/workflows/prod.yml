name: Production Deploy

on:
  pull_request:
    branches: ["prod"]

env:
  RELEASE_DIR: "${{ secrets.PROD_PATH }}"
  SHARED_DIR: "${{ secrets.PROD_PATH }}/shared"
  RELEASE_PATH: "${{ secrets.PROD_PATH }}/releases"
  RELEASE: $(date +%s)

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # -------------------------
      # Build
      # -------------------------

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Assets
        run: npm run build

      # -------------------------
      # Create Release Folder
      # -------------------------

      - name: Create Release Directory
        run: |
          mkdir -p ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          echo "Release directory created at: ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}"

      - name: Copy Files to Release
        run: |
          rsync -av \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="bootstrap/cache" \
            --exclude=".env.*.php" \
            ./ ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/

      # -------------------------
      # Shared Files Setup
      # -------------------------

      - name: Verify Shared Directory
        run: |
          mkdir -p ${{ env.SHARED_DIR }}/{storage,bootstrap/cache}
          if [ ! -f "${{ env.SHARED_DIR }}/.env" ]; then
            echo "ERROR: Shared .env file not found!"
            exit 1
          fi

      - name: Link Storage
        run: |
          rm -rf ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/storage
          ln -nfs ${{ env.SHARED_DIR }}/storage ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/storage

      - name: Link Bootstrap Cache
        run: |
          rm -rf ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/bootstrap/cache
          ln -nfs ${{ env.SHARED_DIR }}/bootstrap/cache ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/bootstrap/cache

      - name: Link .env
        run: |
          rm -f ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/.env
          ln -nfs ${{ env.SHARED_DIR }}/.env ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/.env

      # -------------------------
      # Laravel Setup
      # -------------------------

      - name: Generate Swagger Docs
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan l5-swagger:generate
        continue-on-error: true

      - name: Run Migration
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan migrate --force

      - name: Optimize Laravel
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # -------------------------
      # Switch Release (Atomic)
      # -------------------------

      - name: Activate New Release
        run: |
          ln -nfs ${{ env.RELEASE_PATH }}/${{ env.RELEASE }} ${{ env.RELEASE_DIR }}/current
          echo "Release activated: ${{ env.RELEASE }}"

      # -------------------------
      # Restart Services
      # -------------------------

      - name: Restart Queue
        run: |
          cd ${{ env.RELEASE_DIR }}/current
          php artisan queue:restart || true

      - name: Reload FrankenPHP
        run: sudo systemctl restart frankenphp
        timeout-minutes: 5

      # -------------------------
      # Cleanup Old Releases
      # -------------------------

      - name: Cleanup Old Releases
        run: |
          CURRENT_LINK=$(readlink -f ${{ env.RELEASE_DIR }}/current)
          CURRENT_RELEASE=$(basename "$CURRENT_LINK")
          
          # Keep last 5 releases and current
          ls -dt ${{ env.RELEASE_PATH }}/*/ 2>/dev/null | tail -n +6 | while read dir; do
            RELEASE_NAME=$(basename "$dir")
            if [ "$RELEASE_NAME" != "$CURRENT_RELEASE" ] && [ "$RELEASE_NAME" != "shared" ]; then
              echo "Removing old release: $RELEASE_NAME"
              rm -rf "$dir"
            fi
          done
        continue-on-error: true

      # -------------------------
      # Deployment Summary
      # -------------------------

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment Successful!"
          echo "Release: ${{ env.RELEASE }}"
          echo "Current symlink: ${{ env.RELEASE_DIR }}/current"
          echo "Active release: $(readlink -f ${{ env.RELEASE_DIR }}/current | xargs basename)"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment Failed!"
          echo "Attempting rollback to previous release..."
          PREVIOUS=$(ls -dt ${{ env.RELEASE_PATH }}/*/ 2>/dev/null | head -2 | tail -1)
          if [ -n "$PREVIOUS" ]; then
            ln -nfs "$PREVIOUS" ${{ env.RELEASE_DIR }}/current
            echo "Rollback completed"
          else
            echo "No previous release found for rollback"
          fi