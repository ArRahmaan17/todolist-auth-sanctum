name: Production Deploy

on:
  pull_request:
    branches: ["prod"]

env:
  RELEASE_DIR: "${{ secrets.PROD_PATH }}"
  SHARED_DIR: "${{ secrets.PROD_PATH }}/shared"
  RELEASE_PATH: "${{ secrets.PROD_PATH }}/releases"

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Name
        run: echo "RELEASE=$(date +%s)" >> $GITHUB_ENV

      # -------------------------
      # Build
      # -------------------------
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Assets
        run: npm run build

      # -------------------------
      # Create Release Folder
      # -------------------------
      - name: Create Release Directory
        run: mkdir -p ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}

      - name: Copy Files to Release
        run: |
          rsync -av \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="bootstrap/cache" \
            --exclude=".env.*.php" \
            ./ ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/

      # -------------------------
      # Shared Files Setup
      # -------------------------
      - name: Verify Shared Directory
        run: |
          mkdir -p ${{ env.SHARED_DIR }}/{storage,bootstrap/cache}
          [ -f "${{ env.SHARED_DIR }}/.env" ] || (echo "ERROR: Shared .env missing!" && exit 1)

      - name: Link Shared Files
        run: |
          rm -rf ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/storage
          ln -nfs ${{ env.SHARED_DIR }}/storage ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/storage
          
          rm -rf ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/bootstrap/cache
          ln -nfs ${{ env.SHARED_DIR }}/bootstrap/cache ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/bootstrap/cache
          
          rm -f ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/.env
          ln -nfs ${{ env.SHARED_DIR }}/.env ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/.env

      # -------------------------
      # Laravel Setup
      # -------------------------
      - name: Generate Swagger Docs
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan l5-swagger:generate || true

      - name: Run Migration
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan migrate --force

      - name: Optimize Laravel
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # -------------------------
      # Switch Release
      # -------------------------
      - name: Activate New Release
        run: ln -nfs ${{ env.RELEASE_PATH }}/${{ env.RELEASE }} ${{ env.RELEASE_DIR }}/current

      # -------------------------
      # Restart Services
      # -------------------------
      - name: Restart Queue & FrankenPHP
        run: |
          cd ${{ env.RELEASE_DIR }}/current
          php artisan queue:restart || true
          sudo systemctl restart frankenphp

      # -------------------------
      # Cleanup Old Releases (Keep only 3)
      # -------------------------
      - name: Cleanup Old Releases
        run: |
          # Get the full path of the current active release
          CURRENT_RELEASE_PATH=$(readlink -f ${{ env.RELEASE_DIR }}/current)
          
          # List all directories in release path, sort by date (newest first)
          # tail -n +4 means keep top 3, delete everything from the 4th onwards
          ls -dt ${{ env.RELEASE_PATH }}/*/ | tail -n +4 | while read dir; do
            # Ensure we never delete the currently active release directory
            if [ "$(readlink -f "$dir")" != "$CURRENT_RELEASE_PATH" ]; then
              echo "Removing old release: $dir"
              rm -rf "$dir"
            fi
          done

      - name: Deployment Summary
        run: echo "✅ Release ${{ env.RELEASE }} is live!"