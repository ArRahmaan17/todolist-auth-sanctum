name: Production Deploy

on:
  pull_request:
    types: [closed]
    branches: ["prod"]

env:
  RELEASE_DIR: "${{ secrets.PROD_PATH }}"
  SHARED_DIR: "${{ secrets.PROD_PATH }}/shared"
  RELEASE_PATH: "${{ secrets.PROD_PATH }}/releases"

jobs:
  deploy:
    # Only run if the PR was merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release ID
        run: echo "RELEASE=$(date +%s)" >> $GITHUB_ENV

      # -------------------------
      # Build Process
      # -------------------------
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Assets
        run: npm run build

      # -------------------------
      # Prepare Release
      # -------------------------
      - name: Create Release Directory
        run: mkdir -p ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}

      - name: Copy Files to Release
        run: |
          rsync -av \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="storage" \
            --exclude="bootstrap/cache" \
            ./ ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/

      - name: Link Shared Files
        run: |
          mkdir -p ${{ env.SHARED_DIR }}/{storage,bootstrap/cache}
          
          # Link Storage & Cache
          rm -rf ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/storage
          ln -nfs ${{ env.SHARED_DIR }}/storage ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/storage
          
          rm -rf ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/bootstrap/cache
          ln -nfs ${{ env.SHARED_DIR }}/bootstrap/cache ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/bootstrap/cache
          
          # Link .env
          ln -nfs ${{ env.SHARED_DIR }}/.env ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}/.env

      # -------------------------
      # Laravel Production Setup
      # -------------------------
      - name: Migrate and Optimize
        run: |
          cd ${{ env.RELEASE_PATH }}/${{ env.RELEASE }}
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan l5-swagger:generate || true

      # -------------------------
      # Activation
      # -------------------------
      - name: Activate New Release
        run: ln -nfs ${{ env.RELEASE_PATH }}/${{ env.RELEASE }} ${{ env.RELEASE_DIR }}/current

      - name: Restart Services
        run: |
          sudo systemctl restart frankenphp
          cd ${{ env.RELEASE_DIR }}/current
          php artisan queue:restart || true

      # -------------------------
      # Cleanup (Keep only 3)
      # -------------------------
      - name: Cleanup Old Releases
        run: |
          CURRENT_LIVE=$(readlink -f ${{ env.RELEASE_DIR }}/current)
          
          # List all directories, newest first, skip top 3 (tail -n +4)
          ls -dt ${{ env.RELEASE_PATH }}/*/ | tail -n +4 | while read dir; do
            ABS_DIR=$(readlink -f "$dir")
            
            # Don't delete if it's the live one or the shared folder
            if [ "$ABS_DIR" != "$CURRENT_LIVE" ] && [[ "$dir" != *"shared"* ]]; then
              echo "Removing old release: $dir"
              rm -rf "$dir"
            fi
          done